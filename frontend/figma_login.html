<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figma - Login Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4ecd8;
            --header-bg: #4a3b32;
            --card-bg: #fffbf0;
            --text-main: #3e2723;
            --accent: #8d6e63;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            width: 1440px;
            height: 900px;
            background: rgba(74, 59, 50, 0.9);
            color: var(--text-main);
            font-family: 'Courier Prime', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .login-card {
            background: var(--card-bg);
            border: 3px solid #3e2723;
            border-radius: 12px;
            box-shadow: 8px 8px 0px #3e2723;
            padding: 40px 35px;
            width: 420px;
            text-align: center;
        }
        .login-card h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 2rem;
            color: #3e2723;
            margin: 0 0 10px 0;
        }
        .login-card p {
            font-size: 0.95rem;
            color: #6d4c41;
            margin: 0 0 28px 0;
        }
        .login-form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .login-form-group label {
            font-size: 0.92rem;
            font-weight: bold;
            color: #3e2723;
            display: block;
            margin-bottom: 8px;
        }
        .login-input {
            width: 100%;
            background: var(--bg-color);
            border: 2px solid var(--accent);
            padding: 10px 14px;
            font-family: 'Courier Prime', monospace;
            font-size: 1rem;
            border-radius: 6px;
            color: var(--text-main);
        }
        .btn-login {
            width: 100%;
            background: #d84315;
            color: #fff;
            border: 2px solid #bf360c;
            padding: 12px;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #bf360c;
            border-radius: 6px;
            margin-top: 10px;
        }
        .login-hint {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #8d6e63;
            background: #efebe9;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #a1887f;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#d84315" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 8px;">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <h2>ĐĂNG NHẬP</h2>
        <p>Hệ thống Giám sát & Điều khiển Smart Home</p>

        <div class="login-form-group">
            <label>Tên đăng nhập (Username)</label>
            <input type="text" class="login-input" value="admin">
        </div>
        <div class="login-form-group">
            <label>Mật khẩu (Password)</label>
            <input type="password" class="login-input" value="••••••••">
        </div>

        <button class="btn-login">XÁC THỰC (LOGIN)</button>

        <div class="login-hint">
            Tài khoản mặc định: <b>admin</b> / Mật khẩu: <b>123456</b>
        </div>
    </div>
</body>
</html>
